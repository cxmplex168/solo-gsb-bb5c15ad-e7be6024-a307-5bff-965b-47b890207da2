services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      LEASE_MIN_TTL_MS: "100"
      LEASE_MAX_TTL_MS: "300000"
      LEASE_DEFAULT_TTL_MS: "10000"
      LIMIT_MIN_WINDOW_MS: "1"
      LIMIT_MAX_WINDOW_MS: "86400000"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
